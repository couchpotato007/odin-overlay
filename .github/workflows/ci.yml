name: build-odin-versions

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Evaluate all packages
        run: nix flake show --all-systems

      - name: Build odin (stable)
        run: nix build .#odin -L

      - name: Build odin (nightly)
        run: nix build .#odin-nightly -L

      - name: Build ols (stable)
        run: nix build .#ols -L

      - name: Build ols (nightly)
        run: nix build .#ols-nightly -L
